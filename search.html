<!DOCTYPE html>
<html>
<head>
    <title>CollegeSach - Search</title>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <h1>CollegeSach</h1>
        <button>Home</button>
        <button>Login</button>
    </nav>

    <!-- SEARCH SECTION -->
    <section>
        <h2>Find Your College</h2>
        <input placeholder="Search college name..."/>
        <select>
            <option>All States</option>
            <option>West Bengal</option>
            <option>Maharashtra</option>
            <option>Delhi</option>
        </select>
        <select>
            <option>All Branches</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>Mechanical</option>
        </select>
        <button>Search</button>
    </section>

    <!-- RESULTS -->
    <section>
        <h3>Search Results</h3>
        <div>
            <h4>ABC Engineering College</h4>
            <p>Kolkata, West Bengal</p>
            <p>Rating: 4.2/5</p>
            <button>View Reviews</button>
            <button>Talk to Senior</button>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>CollegeSach — Truth before admission</p>
    </footer>

</body>
</html>
